<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 240" role="img" aria-labelledby="title desc">
  <title id="title">Strategia Pensione</title>
  <desc id="desc">Un percorso crescente tra tre colonne</desc>

  <!-- Colonne arrotondate: PAC, fondo pensione e strategia combinata. -->
  <g opacity="0.96">
    <rect x="83" y="145" width="35" height="70" rx="8" fill="#3E63C8"/>
    <rect x="132" y="105" width="35" height="110" rx="8" fill="#E5A44C"/>
    <rect x="181" y="61" width="35" height="154" rx="8" fill="#72D6B7"/>
  </g>

  <!-- Percorso di crescita: il verde brand resta leggibile sui due temi. -->
  <path d="M42 184L88 153L126 119L166 91L207 49"
        fill="none" stroke="#41E0B4" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M194 49L211 45L207 62"
        fill="none" stroke="#41E0B4" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Punti di passaggio e piccoli accenti per dare ritmo. -->
  <g fill="#17362C" stroke="#72D6B7" stroke-width="3">
    <circle cx="88" cy="153" r="5"/>
    <circle cx="126" cy="119" r="5"/>
    <circle cx="166" cy="91" r="5"/>
  </g>
  <g fill="#72D6B7">
    <circle cx="232" cy="41" r="5"/>
    <circle cx="239" cy="58" r="3" opacity="0.72"/>
  </g>

  <path d="M25 224H245" stroke="#8FA095" stroke-width="5"
        stroke-linecap="round" opacity="0.5"/>
</svg>
